version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20 && { cd frontend 2>/dev/null || true; } && npm install
    build:
      commands:
        - nvm use 20 && { cd frontend 2>/dev/null || true; } && npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*