version: 1
# Point this to your subfolder if you are in a monorepo
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        # Notice we added the subfolder name here!
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: client # <-- REPLACE 'client' WITH YOUR FOLDER NAME